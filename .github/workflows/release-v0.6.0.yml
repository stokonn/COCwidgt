name: Signed Android prerelease v0.6.0

on:
  push:
    tags: ["v0.6.0"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing secrets
        env:
          STORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Required RELEASE_* signing secrets are unavailable." >&2
            exit 1
          }
          umask 077
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/cocwidgt-release.jks"
          test -s "$RUNNER_TEMP/cocwidgt-release.jks"
      - name: Build and verify signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/cocwidgt-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: "5a3fda3ccc7b23a87b02dca1abc5c63aa226b75f7b26950799457ff53282dd94"
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          unzip -t "$apk" >/dev/null
          "$bt/zipalign" -c 4 "$apk"
          certs="$("$bt/apksigner" verify --verbose --print-certs "$apk")"
          cert_sha="$(printf '%s\n' "$certs" | sed -n -E 's/^Signer #1 certificate SHA-256( digest)?: //p' | tr 'A-F' 'a-f')"
          test "$cert_sha" = "$EXPECTED_CERT_SHA256"
          package_line="$("$bt/aapt" dump badging "$apk" | sed -n '/^package:/p')"
          grep -Fq "package: name='dev.stokonn.cocwidgt' versionCode='7' versionName='0.6.0'" <<< "$package_line"
          cp "$apk" cocw0.6.0.apk
          sha256sum cocw0.6.0.apk > SHA256SUMS.txt
      - name: Publish verified v0.6.0 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.6.0 cocw0.6.0.apk SHA256SUMS.txt \
            --verify-tag --draft --title "COCwidgt v0.6.0" --prerelease \
            --notes-file .github/release-notes-v0.6.0.md
          release_state="$(gh release view v0.6.0 --json isPrerelease,assets --jq 'if .isPrerelease and any(.assets[]; .name == "cocw0.6.0.apk") then "ok" else "invalid" end')"
          test "$release_state" = "ok"
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download v0.6.0 --pattern cocw0.6.0.apk --dir "$RUNNER_TEMP/release-check"
          cmp cocw0.6.0.apk "$RUNNER_TEMP/release-check/cocw0.6.0.apk"
          gh release edit v0.6.0 --draft=false --prerelease
