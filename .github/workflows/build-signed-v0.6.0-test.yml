name: Build signed v0.6.0 test APK

on:
  push:
    branches:
      - feature/v0.6.0-th19-adaptive-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets and stage keystore
        env:
          STORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing release signing secrets. Configure the existing RELEASE_* repository secrets." >&2
            exit 1
          }
          umask 077
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/cocwidgt-release.jks"
          test -s "$RUNNER_TEMP/cocwidgt-release.jks"

      - name: Run checks and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/cocwidgt-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify package metadata, APK integrity, and release certificate
        env:
          # The existing v0.5.1 workflow records the full 64-character SHA-256.
          EXPECTED_CERT_SHA256: "5a3fda3ccc7b23a87b02dca1abc5c63aa226b75f7b26950799457ff53282dd94"
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"

          unzip -t "$apk" > /dev/null
          "$bt/zipalign" -c 4 "$apk"

          certs="$("$bt/apksigner" verify --verbose --print-certs "$apk")"
          cert_sha="$(printf '%s\n' "$certs" | sed -n -E 's/^Signer #1 certificate SHA-256( digest)?: //p' | tr 'A-F' 'a-f')"
          if [ "$cert_sha" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate fingerprint mismatch; refusing to stage artifact." >&2
            exit 1
          fi

          badging="$("$bt/aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n '/^package:/p')"
          grep -Fq "package: name='dev.stokonn.cocwidgt' versionCode='7' versionName='0.6.0'" <<< "$package_line"

          cp "$apk" cocwidgt-v0.6.0-test-signed.apk
          sha256sum cocwidgt-v0.6.0-test-signed.apk > SHA256SUMS.txt
          {
            printf '### Signed v0.6.0 test APK verification\n\n'
            printf -- '- Package: `dev.stokonn.cocwidgt` 0.6.0 (version code 7).\n'
            printf -- '- APK ZIP integrity and 4-byte alignment verified.\n'
            printf -- '- Release certificate SHA-256 matched the v0.5.1 release certificate.\n'
            printf -- '- APK SHA-256: `%s`\n' "$(cut -d' ' -f1 SHA256SUMS.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cocwidgt-v0.6.0-test-signed-apk
          path: |
            cocwidgt-v0.6.0-test-signed.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
