name: Recover original COCwidgt release keystore

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    name: Repackage and encrypt original release keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Repackage and encrypt keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          NEW_STORE_PASSWORD: ${{ secrets.COCWIDGT_LOCAL_STORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.COCWIDGT_LOCAL_KEY_PASSWORD }}
          AGE_RECIPIENT: age1fu5qm2gsk9grqq8zx9mlscudhx3sktmg8g9fhhx7jt8cfzf0xa4sgqc9e6
          EXPECTED_SHA256: 5a3fda3ccc7b23a87b02dca1abc5c63aa226b75f7b26950799457ff53282dd94
        run: |
          set -euo pipefail
          set +x
          export LC_ALL=C
          umask 077

          work_dir="$(mktemp -d "$RUNNER_TEMP/cocwidgt.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT

          source_keystore="$work_dir/original.jks"
          new_keystore="$work_dir/cocwidgt-original-release.jks"

          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$NEW_STORE_PASSWORD"
          test -n "$NEW_KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$source_keystore"
          test -s "$source_keystore"

          keytool -importkeystore \
            -srckeystore "$source_keystore" \
            -srcalias "$KEY_ALIAS" \
            -srcstorepass "$STORE_PASSWORD" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$new_keystore" \
            -deststoretype JKS \
            -deststorepass "$NEW_STORE_PASSWORD" \
            -destkeypass "$NEW_KEY_PASSWORD" \
            -destalias cocwidgt \
            -noprompt \
            > "$work_dir/import.log" 2>&1

          fingerprint="$(
            keytool -list -v \
              -keystore "$new_keystore" \
              -storepass "$NEW_STORE_PASSWORD" \
              -alias cocwidgt 2>/dev/null |
            awk -F': ' '/SHA256:/{print $2; exit}' |
            tr -d ':[:space:]' |
            tr 'A-F' 'a-f'
          )"

          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo "Original signing certificate fingerprint mismatch."
            exit 1
          fi

          keytool -certreq -rfc \
            -alias cocwidgt \
            -keystore "$new_keystore" \
            -storepass "$NEW_STORE_PASSWORD" \
            -keypass "$NEW_KEY_PASSWORD" \
            -file "$work_dir/check.csr" \
            > /dev/null 2>&1

          age -r "$AGE_RECIPIENT" \
            -o "$RUNNER_TEMP/cocwidgt-original-release.jks.age" \
            "$new_keystore"

          unset KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD
          unset NEW_STORE_PASSWORD NEW_KEY_PASSWORD KEY_ALIAS

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cocwidgt-original-release-keystore
          path: ${{ runner.temp }}/cocwidgt-original-release.jks.age
          retention-days: 1
          if-no-files-found: error
