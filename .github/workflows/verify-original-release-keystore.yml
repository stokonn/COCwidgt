name: Verify original COCwidgt release keystore (temporary)

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify original release signing key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Java 17 for keytool
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify keystore and certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_SHA256: "5a3fda3ccc7b23a87b02dca1abc5c63aa226b75f7b26950799457ff53282dd94"
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export LC_ALL=C

          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "One or more required signing secrets are missing." >&2
            exit 1
          fi

          umask 077
          work_dir="$(mktemp -d "$RUNNER_TEMP/keystore-verification.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          keystore="$work_dir/original-release.keystore"

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" 2>/dev/null; then
            echo "Unable to decode the configured keystore secret." >&2
            exit 1
          fi
          unset KEYSTORE_BASE64
          test -s "$keystore" || { echo "Decoded keystore is empty." >&2; exit 1; }

          if ! keytool -list -v -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
              > "$work_dir/keystore-info.txt" 2> "$work_dir/keytool-error.txt"; then
            echo "keytool could not open the keystore entry with the configured alias and store password." >&2
            exit 1
          fi

          fingerprint="$(awk -F': ' '/SHA256:/{print $2; exit}' "$work_dir/keystore-info.txt" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "keytool did not return a valid SHA-256 certificate fingerprint." >&2
            exit 1
          fi

          printf 'Alias: %s\nSHA-256: %s\n' "$KEY_ALIAS" "$fingerprint"
          if [[ "$fingerprint" != "$EXPECTED_SHA256" ]]; then
            echo "Certificate fingerprint does not match the expected original release certificate." >&2
            exit 1
          fi

          # A certificate request verifies that keytool can unlock the private key with
          # the configured key password. The public CSR stays in runner temp and is removed.
          if ! keytool -certreq -rfc -alias "$KEY_ALIAS" -keystore "$keystore" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$work_dir/check.csr" \
              > /dev/null 2> "$work_dir/certreq-error.txt"; then
            echo "keytool could not unlock the private key with the configured key password." >&2
            exit 1
          fi
          if [[ ! -f "$work_dir/check.csr" || ! -s "$work_dir/check.csr" ]]; then
            echo "keytool did not create a non-empty certificate request." >&2
            exit 1
          fi

          unset STORE_PASSWORD KEY_PASSWORD KEY_ALIAS
