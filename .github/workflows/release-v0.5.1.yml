name: Signed Android prerelease v0.5.1

# Fail closed if repository signing secrets are unavailable; create the prerelease
# only after the signed APK and manifest metadata have been verified.

on:
  push:
    tags: ["v0.5.1"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        env:
          STORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing release signing secrets. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD." >&2
            exit 1
          }
          umask 077
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/cocwidgt-release.jks"
          test -s "$RUNNER_TEMP/cocwidgt-release.jks"

      - name: Run verification and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/cocwidgt-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | sed -n '/^package:/p'
          printf '%s\n' "$badging" | grep -Fq "package: name='dev.stokonn.cocwidgt' versionCode='6' versionName='0.5.1'"

          cp "$apk" cocw0.5.1.apk
          sha256sum cocw0.5.1.apk > SHA256SUMS.txt

      - name: Publish verified v0.5.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.5.1 cocw0.5.1.apk SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "COCwidgt v0.5.1" \
            --prerelease \
            --notes "COCwidgt v0.5.1 prerelease. Village upgrades come from the local Clash of Clans JSON export. The optional Developer API key is used only to look up and cache the public player name. The widget adjusts visible upgrades to the launcher-reported size."

          release_state="$(gh release view v0.5.1 --json isPrerelease,assets --jq 'if .isPrerelease and any(.assets[]; .name == "cocw0.5.1.apk") then "ok" else "invalid" end')"
          test "$release_state" = "ok"
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download v0.5.1 --pattern cocw0.5.1.apk --dir "$RUNNER_TEMP/release-check"
          cmp cocw0.5.1.apk "$RUNNER_TEMP/release-check/cocw0.5.1.apk"
          gh release edit v0.5.1 --draft=false --prerelease
