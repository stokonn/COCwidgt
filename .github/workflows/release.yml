name: Signed Android prerelease

on:
  push:
    tags: ["v0.4.0"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing secrets
        env:
          STORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing release signing secrets. Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD." >&2
            exit 1
          }
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/cocwidgt-release.jks"
      - name: Run verification and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/cocwidgt-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Create prerelease and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.0 app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SHA256SUMS.txt \
            --title "COCwidgt v0.4.0" --prerelease --notes-file .github/release-notes-v0.4.0.md
      - name: Verify uploaded APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download v0.4.0 --pattern app-release.apk --dir "$RUNNER_TEMP/release-check"
          test -s "$RUNNER_TEMP/release-check/app-release.apk"
          cmp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-check/app-release.apk"
